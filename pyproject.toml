[project]
name = "jevguard-nsfa"
version = "0.1.0"
description = "System One Jev implementation of the NSFA agent-security guardrail taxonomy and benchmark harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "JevGuard-NSFA contributors" }]
dependencies = [
  "typesafe-sdk>=0.7.0,<0.8",
]

[project.optional-dependencies]
benchmark = [
  "datasets>=4.0",
  "numpy>=2.0",
]
singguard = [
  "datasets>=4.0",
  "huggingface-hub>=0.35",
  "numpy>=2.0",
  "torch>=2.7",
  "transformers>=4.56",
  "vllm>=0.10",
]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[project.scripts]
jevguard-nsfa = "jevguard_nsfa.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevguard_nsfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
