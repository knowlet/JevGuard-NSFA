name: Benchmark JevGuard

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Official NSFA benchmark subset
        required: true
        default: query
        type: choice
        options:
          - query
          - response
          - cross-source-query
      limit:
        description: Number of samples
        required: true
        default: "1000"
      concurrency:
        description: Concurrent Jev requests
        required: true
        default: "8"
      rpm:
        description: Request-start rate limit
        required: true
        default: "900"
      model:
        description: Jev model
        required: true
        default: jev-latest

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL || 'https://api.typesafe.ai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[benchmark]"
      - name: Require TypeSafe credential
        run: test -n "$TYPESAFE_API_KEY"
      - name: Run benchmark
        run: |
          jevguard-nsfa bench-jev \
            --benchmark "${{ inputs.benchmark }}" \
            --limit "${{ inputs.limit }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --rpm "${{ inputs.rpm }}" \
            --model "${{ inputs.model }}" \
            --output benchmark-results/jevguard.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jevguard-nsfa-${{ inputs.benchmark }}-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
